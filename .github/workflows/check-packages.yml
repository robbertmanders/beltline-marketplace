# One job, named check-packages, on every pull request to main and every push
# to main. Fork pull requests use the pull_request event and
# the default read-only token. The job does not read secrets and does not
# execute package contents.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-packages:
    name: check-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check packages
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "${BASE_SHA}" ] || [ -z "${HEAD_SHA}" ]; then
            echo "::error::base commit is missing or unreadable"
            exit 1
          fi
          ZERO=0000000000000000000000000000000000000000
          if [ "${BASE_SHA}" != "${ZERO}" ]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
              git fetch --no-tags origin "${BASE_SHA}"
            fi
            if ! git cat-file -e "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
              echo "::error::base commit ${BASE_SHA} is missing or unreadable"
              exit 1
            fi
          fi
          python3 scripts/check_packages.py --base "${BASE_SHA}" --head "${HEAD_SHA}"
